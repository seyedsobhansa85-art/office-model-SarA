<html lang="fa" dir="rtl">

<meta property="og:title" content="دفتر معماری · رود">

<meta name="theme-color" content="#e9e4db">
<style>
/* VOICE: quiet, gallery-like architecture presentation
   IDEA: a white architectural model photographed in a studio, that can also be seen at dusk
   PICTURE: the 3D pavilion fills the screen; UI floats as a slim dock
   COLOUR and TYPE: warm stone #e9e4db, ink #1d2430, river-red #c1121f; Vazirmatn
   LAYOUT: title top-right (RTL), dock at bottom, loading veil */
@font-face{font-family:Vazirmatn;src:url(fonts/Vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#e9e4db;--ink:#1d2430;--mute:rgba(29,36,48,.58);--glass:rgba(250,248,244,.72);--line:rgba(29,36,48,.12);--acc:#c1121f;--on:#1d2430;--onink:#f6f3ee}
body.night{--ink:#eef0f4;--mute:rgba(238,240,244,.62);--glass:rgba(22,27,38,.66);--line:rgba(255,255,255,.12);--on:#eef0f4;--onink:#141a25}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Vazirmatn,Tahoma,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body.night{background:#121826}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:max(16px,env(safe-area-inset-top));inset-inline:18px;pointer-events:none;transition:color .6s}
.kicker{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
.kicker i{display:inline-block;width:18px;height:2px;background:var(--acc);border-radius:2px}
h1{margin:4px 0 0;font-size:30px;font-weight:300;line-height:1.1;letter-spacing:0}
h1 b{font-weight:700}
#sub{margin:6px 0 0;font-size:13px;color:var(--mute);max-width:30ch}
.dock{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));inset-inline:12px;margin-inline:auto;max-width:540px;display:grid;gap:8px;transition:opacity .6s}
.panel{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:rgba(127,127,127,.1);border-radius:16px;padding:4px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;min-height:40px;border-radius:12px;cursor:pointer;transition:background .25s,color .25s}
.seg button[aria-pressed=true]{background:var(--on);color:var(--onink)}
.chips{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;font:inherit;font-size:13.5px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;min-height:38px;padding:0 15px;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.chip[aria-pressed=true]{background:var(--on);color:var(--onink);border-color:var(--on)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hint{font-size:11.5px;color:var(--mute);text-align:center;margin:6px 0 0}
#veil{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;transition:opacity .9s ease,visibility .9s}
#veil.done{opacity:0;visibility:hidden}
#veil div{text-align:center}
#veil b{display:block;font-size:22px;font-weight:300}
#veil span{display:block;margin:14px auto 0;width:120px;height:2px;background:rgba(0,0,0,.08);border-radius:2px;overflow:hidden;position:relative}
#veil span::after{content:"";position:absolute;inset:0;width:40%;background:var(--acc);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
@media (prefers-reduced-motion:reduce){#veil span::after{animation:none}}
@media (min-width:700px){h1{font-size:40px}}
